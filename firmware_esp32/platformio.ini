; ============================================================
;  Brazo robótico — Firmware ESP32 + PCA9685
;  PlatformIO descarga solo la plataforma y la librería.
; ============================================================
[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino

; Monitor serie (misma velocidad que en main.cpp)
monitor_speed = 115200
monitor_eol   = LF
monitor_echo  = yes

; Librería del driver PCA9685
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.0
